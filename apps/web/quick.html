<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkLog 빠른 패널</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/quick.css"><link rel="stylesheet" href="/icons.css"></head>
<body class="quick-panel">
  <header class="quick-header"><div class="quick-brand"><span class="brand-mark" aria-hidden="true">W</span><div><h1>WorkLog</h1><p>이 컴퓨터의 업무</p></div></div><button class="quick-open" data-view="items" aria-label="WorkLog 전체 창 열기" title="전체 창 열기"><svg class="menu-icon" data-icon="open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3h7v7M21 3 10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></button></header>
  <div class="quick-health" id="quick-health" role="status">서비스 연결 중…</div>
  <div class="quick-counts"><button data-view="notifications">알림 <strong id="notification-count">—</strong></button><button data-view="current">현재 작업 <strong id="current-count">—</strong></button></div>
  <main class="quick-content" aria-label="빠른 업무 목록"><div id="quick-groups"><p class="quick-empty">업무를 불러오는 중…</p></div></main>
  <footer class="quick-footer"><button data-view="items"><svg class="menu-icon" data-icon="items" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg> 업무 목록</button><button data-view="calendar"><svg class="menu-icon" data-icon="calendar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/></svg> 오늘 캘린더</button><button data-view="settings"><svg class="menu-icon" data-icon="settings" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-2v-3l3-2-1-3-3-1-1-3z"/><circle cx="10.5" cy="10.5" r="3"/></svg> 연결 설정</button></footer>
  <script type="module" src="/quick.js"></script>
</body></html>
