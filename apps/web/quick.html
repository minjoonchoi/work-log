<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Log 빠른 패널</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/quick.css"></head>
<body class="quick-panel">
  <header class="quick-header"><div class="quick-brand"><span class="brand-mark" aria-hidden="true">W</span><div><h1>Work Log</h1><p>이 컴퓨터의 업무</p></div></div><button class="quick-open" data-view="items" aria-label="Work Log 전체 창 열기" title="전체 창 열기">↗</button></header>
  <div class="quick-health" id="quick-health" role="status">서비스 연결 중…</div>
  <div class="quick-counts"><button data-view="current">현재 작업 <strong id="current-count">—</strong></button><button data-view="waiting-user">사용자 답변 <strong id="waiting-count">—</strong></button><button data-view="attention">확인 필요 <strong id="attention-count">—</strong></button></div>
  <main class="quick-content" aria-label="빠른 업무 목록"><div id="quick-groups"><p class="quick-empty">업무를 불러오는 중…</p></div></main>
  <footer class="quick-footer"><button data-view="items">업무 목록</button><button data-view="calendar">오늘 캘린더</button><button data-view="settings">연결 설정</button></footer>
  <script type="module" src="/quick.js"></script>
</body></html>
